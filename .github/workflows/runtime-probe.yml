name: Alternative runtime configuration probe

on:
  push:
    branches: [lab/alternative-runtime-callback-retention]

jobs:
  probe:
    name: ${{ matrix.ruby-version }} (${{ matrix.variant }})
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      BUNDLE_WITHOUT: perf
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: debug
            variant: retain-callbacks
          - ruby-version: truffleruby-head
            variant: control
          - ruby-version: truffleruby-33.1.0
            variant: control
          - ruby-version: truffleruby+graalvm-head
            variant: control
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install libcurl header
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends libcurl4-openssl-dev
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Restore the unpatched control
        if: matrix.variant == 'control'
        run: git checkout 160b56a -- lib/ethon/multi/options.rb
      - name: Record runtime versions
        run: |
          ruby --version
          bundle exec ruby -e 'require "ffi"; puts "ffi #{FFI::VERSION}"'
          curl --version
      - name: Repeat socket-action integration specs
        run: |
          for attempt in 1 2 3
          do
            echo "socket-action attempt ${attempt}"
            bundle exec rspec spec/ethon/multi_spec.rb
          done
      - name: Run full suite
        run: bundle exec rspec
